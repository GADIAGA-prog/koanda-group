<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">GCM Industries Logo</title>
  <desc id="desc">Logo vectoriel GCM Industries avec symbole industriel rouge et typographie bleu foncé.</desc>
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2b2b"/>
      <stop offset="55%" stop-color="#e30613"/>
      <stop offset="100%" stop-color="#a9000b"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#152235"/>
      <stop offset="100%" stop-color="#25344a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#ffffff"/>

  <!-- Industrial swirl icon -->
  <g transform="translate(120 70)" filter="url(#softShadow)">
    <circle cx="140" cy="140" r="74" fill="none" stroke="url(#redGrad)" stroke-width="26" stroke-linecap="round" opacity="0.98"/>
    <path d="M91 53 C129 24 194 28 236 63 L270 40 L278 121 C229 88 191 79 150 86 C118 91 94 105 71 130 Z" fill="url(#redGrad)"/>
    <path d="M230 91 C262 130 257 195 219 235 L245 269 L161 276 C196 230 207 192 201 151 C196 119 183 94 160 70 Z" fill="url(#redGrad)"/>
    <path d="M188 228 C149 260 84 256 43 219 L9 242 L1 160 C49 194 87 204 128 197 C160 192 185 178 207 153 Z" fill="url(#redGrad)"/>
    <path d="M49 188 C17 149 22 84 60 44 L34 10 L118 3 C83 49 72 88 78 129 C83 161 97 186 120 209 Z" fill="url(#redGrad)" opacity="0.92"/>
    <circle cx="140" cy="140" r="57" fill="#ffffff" opacity="0.96"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(420 95)">
    <text x="0" y="125"
          font-family="Montserrat, Poppins, Arial, Helvetica, sans-serif"
          font-size="150"
          font-weight="800"
          font-style="italic"
          letter-spacing="-8"
          fill="url(#navyGrad)">gcm</text>
    <text x="35" y="205"
          font-family="Montserrat, Poppins, Arial, Helvetica, sans-serif"
          font-size="56"
          font-weight="600"
          letter-spacing="9"
          fill="#334155">INDUSTRIES</text>
  </g>
</svg>
